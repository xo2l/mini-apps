<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#f7f7f5}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Spin Stencil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: workshop — controls on a paper panel at left, a green cutting mat at right where the disks lie */
:root{
  --bg:#e9ece6; --panel:#f8f9f5; --ink:#17211d; --muted:#5a6962; --line:#d2d8d0;
  --mat:#1f4a3d; --mat-grid:rgba(255,255,255,.07); --mat-grid2:rgba(255,255,255,.16); --mat-ink:#cfe3d9;
  --accent:#e2560b; --accent-ink:#fff; --paper:#fbfbf7; --warn:#b3261b; --ok:#2b7a4b;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1513; --panel:#151e1b; --ink:#e6ebe7; --muted:#93a39b; --line:#2a3732;
  --mat:#173a30; --mat-grid:rgba(255,255,255,.05); --mat-grid2:rgba(255,255,255,.12); --mat-ink:#b9d3c6;
  --accent:#ff7a2e; --accent-ink:#1a0d04; --paper:#f3f2ec; --warn:#ff7b6e; --ok:#5fcf8f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1513; --panel:#151e1b; --ink:#e6ebe7; --muted:#93a39b; --line:#2a3732;
  --mat:#173a30; --mat-grid:rgba(255,255,255,.05); --mat-grid2:rgba(255,255,255,.12); --mat-ink:#b9d3c6;
  --accent:#ff7a2e; --accent-ink:#1a0d04; --paper:#f3f2ec; --warn:#ff7b6e; --ok:#5fcf8f; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font:700 clamp(22px,4vw,32px)/1.1 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:62ch}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:18px}
.sec{display:grid;gap:10px}
.lbl{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop canvas{width:64px;height:64px;border-radius:50%;background:#fff;flex:none;border:1px solid var(--line)}
.drop div{min-width:0;font-size:13.5px;color:var(--muted)}
.drop b{display:block;color:var(--ink);font-weight:600;font-size:14.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:500 13.5px var(--f-body);padding:8px 6px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.row label{font-size:14px}
.row output{font:600 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.row input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 10px 4px 4px;font:500 13px var(--f-body);cursor:pointer}
.sw i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:block;position:relative}
.sw button[aria-pressed="false"]{color:var(--muted)}
.sw button[aria-pressed="false"] i::after{content:"";position:absolute;inset:-2px;background:linear-gradient(45deg,transparent 46%,var(--warn) 47%,var(--warn) 53%,transparent 54%)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 13.5px var(--f-body);padding:9px 12px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button:focus-visible,input:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mat{background-color:var(--mat);background-image:
  linear-gradient(var(--mat-grid2) 1px,transparent 1px),linear-gradient(90deg,var(--mat-grid2) 1px,transparent 1px),
  linear-gradient(var(--mat-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mat-grid) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;border-radius:12px;padding:18px;display:grid;gap:16px;color:var(--mat-ink);min-width:0}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:center}
@media (max-width:1060px){.stage{grid-template-columns:1fr}}
.simbox{position:relative;width:100%;max-width:600px;margin:0 auto;aspect-ratio:1}
#sim{width:100%;height:100%;display:block}
.busy{position:absolute;inset:auto 0 8px 0;text-align:center;font:500 13px var(--f-mono);color:var(--mat-ink)}
.stats{display:grid;gap:10px;font-size:13.5px}
.stat{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--mat-grid2);padding-bottom:6px}
.stat b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums;color:#fff}
.warn{color:#ffc2b8;font-size:13px;margin:0}
.player{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.player input[type=range]{flex:1 1 180px;accent-color:var(--accent)}
.player .pos{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums;color:#fff;min-width:7ch}
.player .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.player label{display:flex;gap:6px;align-items:center;font-size:13.5px}
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
figure{margin:0;display:grid;gap:8px;min-width:0}
figure .sheet{background:var(--paper);border-radius:6px;padding:10px;box-shadow:0 6px 16px rgba(0,0,0,.28)}
figure svg{width:100%;height:auto;display:block}
figcaption{font-size:13px;color:var(--mat-ink)}
figcaption b{color:#fff;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;max-width:calc(100% - 32px)}
.lang{margin-left:auto;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px var(--f-mono);letter-spacing:.06em;padding:5px 9px;border-radius:6px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="title"></h1>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="ru" aria-pressed="false">RU</button></div>
    <p data-i18n="lead"></p>
  </header>
  <div class="layout">
    <aside>
      <div class="sec">
        <span class="lbl" data-i18n="secImage"></span>
        <div class="drop" id="drop" tabindex="0" role="button" data-i18n-aria="dropAria">
          <canvas id="thumb" width="128" height="128"></canvas>
          <div><b id="imgName"></b><span data-i18n="dropHint"></span></div>
        </div>
        <input type="file" id="file" accept="image/*" hidden>
        <div class="row"><label for="zoom" data-i18n="zoom"></label><output id="zoomO"></output><input type="range" id="zoom" min="0.5" max="2" step="0.05" value="1"></div>
        <div class="row"><label for="kcol" data-i18n="kcol"></label><output id="kcolO"></output><input type="range" id="kcol" min="2" max="6" step="1" value="4"></div>
        <span class="lbl" data-i18n="secPaint"></span>
        <div class="sw" id="swatches"></div>
        <p class="hint" data-i18n="paintHint"></p>
      </div>
      <div class="sec">
        <span class="lbl" data-i18n="secStyle"></span>
        <div class="seg" role="group" data-i18n-aria="secStyle">
          <button id="sLine" aria-pressed="true" data-i18n="styleLine"></button>
          <button id="sFill" aria-pressed="false" data-i18n="styleFill"></button>
        </div>
        <div class="row" id="lineRow"><label for="lineW" data-i18n="lineW"></label><output id="lineWO"></output><input type="range" id="lineW" min="0.8" max="5" step="0.1" value="2.2"></div>
        <p class="hint" id="styleHint"></p>
      </div>
      <div class="sec">
        <span class="lbl" data-i18n="secCut"></span>
        <div class="seg" role="group" data-i18n-aria="secCut">
          <button id="mHand" aria-pressed="true" data-i18n="modeHand"></button>
          <button id="mLaser" aria-pressed="false" data-i18n="modeLaser"></button>
        </div>
        <p class="hint" id="modeHint"></p>
      </div>
      <div class="sec">
        <span class="lbl" data-i18n="secDisk"></span>
        <div class="row"><label for="diam" data-i18n="diam"></label><output id="diamO"></output><input type="range" id="diam" min="100" max="160" step="5" value="150"></div>
        <div class="row"><label for="npos" data-i18n="npos"></label><output id="nposO"></output><input type="range" id="npos" min="8" max="36" step="1" value="24"></div>
        <div class="row"><label for="piece" data-i18n="piece"></label><output id="pieceO"></output><input type="range" id="piece" min="6" max="26" step="1" value="16"></div>
        <div class="row"><label for="bridge" data-i18n="bridge"></label><output id="bridgeO"></output><input type="range" id="bridge" min="0.8" max="4" step="0.1" value="2.5"></div>
        <button class="btn" id="reseed" data-i18n="reseed"></button>
      </div>
      <div class="sec">
        <span class="lbl" data-i18n="secExport"></span>
        <div class="btns">
          <button class="btn primary" id="dlPdf" data-i18n="dlPdf"></button>
          <button class="btn" id="dlZip" data-i18n="dlBoth"></button>
          <button class="btn" id="dlStencil" data-i18n="dlStencil"></button>
          <button class="btn" id="dlBase" data-i18n="dlBase"></button>
        </div>
        <p class="hint" id="exportHint"></p>
      </div>
    </aside>

    <section class="mat" data-i18n-aria="matAria">
      <div class="stage">
        <div class="simbox"><canvas id="sim" data-i18n-aria="simAria"></canvas><div class="busy" id="busy" hidden data-i18n="busy"></div></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="player">
        <button class="btn" id="play"></button>
        <input type="range" id="step" min="0" max="24" step="1" value="14" data-i18n-aria="stepAria">
        <span class="pos" id="posO"></span>
        <label><input type="checkbox" id="lift"> <span data-i18n="lift"></span></label>
      </div>
      <div class="sheets">
        <figure><div class="sheet" id="svgStencil"></div><figcaption data-i18n-html="capStencil"></figcaption></figure>
        <figure><div class="sheet" id="svgBase"></div><figcaption data-i18n-html="capBase"></figcaption></figure>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== core: pure geometry, no DOM ===================== */
const G = 560;                 // working raster across the stencil diameter
const AXLE = 3;                // mm, axle hole diameter

function rngOf(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// P: Int8Array G*G, color index to paint or -1. Returns layout.
function buildLayout(P, o){
  const s = o.D / G, c = G/2, rnd = rngOf(o.seed*7919+o.N*31+1);
  const T = o.piece / s, minA = Math.max(4, o.minArea / (s*s));
  const N = o.N, br = o.bridge / s;
  // 1. jittered seeds -> voronoi cell per painted pixel
  const nc = Math.ceil(G/T)+2, sx = new Float32Array(nc*nc), sy = new Float32Array(nc*nc);
  for (let j=0;j<nc;j++) for (let i=0;i<nc;i++){ sx[j*nc+i]=(i+0.15+0.7*rnd())*T; sy[j*nc+i]=(j+0.15+0.7*rnd())*T; }
  const cell = new Int32Array(G*G).fill(-1);
  for (let y=0;y<G;y++) for (let x=0;x<G;x++){ const p=y*G+x; if(P[p]<0) continue;
    const gx=Math.floor((x+.5)/T), gy=Math.floor((y+.5)/T); let best=-1,bd=1e18;
    for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){ const ii=gx+dx, jj=gy+dy; if(ii<0||jj<0||ii>=nc||jj>=nc) continue;
      const k=jj*nc+ii, ex=sx[k]-x-.5, ey=sy[k]-y-.5, d=ex*ex+ey*ey; if(d<bd){bd=d;best=k;} }
    cell[p]=best; }
  // 2. connected components of (cell,color)
  const F = new Int32Array(G*G).fill(-1); const frags=[]; const stack=[];
  for (let p=0;p<G*G;p++){ if(P[p]<0||F[p]>=0) continue;
    const id=frags.length, col=P[p], ce=cell[p], pix=[]; F[p]=id; stack.push(p);
    while(stack.length){ const q=stack.pop(); pix.push(q); const x=q%G, y=(q/G)|0;
      if(x>0){const r=q-1; if(F[r]<0&&P[r]===col&&cell[r]===ce){F[r]=id;stack.push(r);}}
      if(x<G-1){const r=q+1; if(F[r]<0&&P[r]===col&&cell[r]===ce){F[r]=id;stack.push(r);}}
      if(y>0){const r=q-G; if(F[r]<0&&P[r]===col&&cell[r]===ce){F[r]=id;stack.push(r);}}
      if(y<G-1){const r=q+G; if(F[r]<0&&P[r]===col&&cell[r]===ce){F[r]=id;stack.push(r);}} }
    frags.push({id, color:col, pix, depth:0, alive:true}); }
  // 3. merge tiny pieces into a same-colour neighbour
  const order = frags.slice().sort((a,b)=>a.pix.length-b.pix.length);
  let dropped=0;
  for (const f of order){ if(!f.alive || f.pix.length>=minA) continue;
    const cnt=new Map();
    for (const q of f.pix){ const x=q%G; for (const r of [x>0?q-1:-1, x<G-1?q+1:-1, q-G, q+G]){ if(r<0||r>=G*G) continue; const g=F[r]; if(g>=0&&g!==f.id&&frags[g].color===f.color) cnt.set(g,(cnt.get(g)||0)+1); } }
    let tgt=-1,bc=0; for (const [g,n] of cnt) if(n>bc){bc=n;tgt=g;}
    if (tgt>=0){ const t=frags[tgt]; for (const q of f.pix){F[q]=tgt; t.pix.push(q);} f.alive=false; f.pix=[]; }
    else if (f.pix.length < 6){ for (const q of f.pix) F[q]=-1; dropped+=f.pix.length; f.alive=false; f.pix=[]; }
  }
  const stat = f=>{ let x0=G,y0=G,x1=0,y1=0,sx_=0,sy_=0; for(const q of f.pix){const x=q%G,y=(q/G)|0; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; sx_+=x; sy_+=y;}
    f.x0=x0;f.y0=y0;f.x1=x1;f.y1=y1; f.cx=sx_/f.pix.length+.5; f.cy=sy_/f.pix.length+.5; f.r=Math.hypot(f.cx-c,f.cy-c); };
  let queue = frags.filter(f=>f.alive); queue.forEach(stat);
  const totalPx = queue.reduce((a,f)=>a+f.pix.length,0)+dropped;
  queue.sort((a,b)=>a.r-b.r);
  // 4. placement on the stencil
  const O=new Uint8Array(G*G), H=new Int32Array(G*G).fill(-1);
  const disk=[]; const bri=Math.ceil(br); for(let dy=-bri;dy<=bri;dy++)for(let dx=-bri;dx<=bri;dx++) if(dx*dx+dy*dy<=br*br) disk.push(dy*G+dx, dx, dy);
  const usage=new Array(N).fill(0); const placed=[]; const failed=[];
  function windowPix(f,th){ const cs=Math.cos(th), sn=Math.sin(th);
    // stencil bbox = R(-th) of fragment bbox corners
    let qx0=1e9,qy0=1e9,qx1=-1e9,qy1=-1e9;
    for (const [px,py] of [[f.x0,f.y0],[f.x1+1,f.y0],[f.x0,f.y1+1],[f.x1+1,f.y1+1]]){ const X=px-c, Y=py-c; const qx= X*cs+Y*sn + c, qy=-X*sn+Y*cs + c;
      qx0=Math.min(qx0,qx); qx1=Math.max(qx1,qx); qy0=Math.min(qy0,qy); qy1=Math.max(qy1,qy); }
    qx0=Math.max(0,Math.floor(qx0)-1); qy0=Math.max(0,Math.floor(qy0)-1); qx1=Math.min(G-1,Math.ceil(qx1)+1); qy1=Math.min(G-1,Math.ceil(qy1)+1);
    const W=[];
    for (let qy=qy0;qy<=qy1;qy++){ const Y=qy+.5-c; for (let qx=qx0;qx<=qx1;qx++){ const X=qx+.5-c;
      const px=Math.floor(X*cs-Y*sn+c), py=Math.floor(X*sn+Y*cs+c);
      if(px>=0&&py>=0&&px<G&&py<G&&F[py*G+px]===f.id) W.push(qy*G+qx); } }
    return W; }
  let qi=0;
  while (qi<queue.length){ const f=queue[qi++];
    const ks=[...Array(N).keys()].map(k=>[k,usage[k]+rnd()*1.5]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]);
    let ok=false;
    for (const k of ks){ const th=k*2*Math.PI/N; const W=windowPix(f,th); if(!W.length) continue;
      let free=true; for(const q of W) if(O[q]){free=false;break;} if(!free) continue;
      for(const q of W){O[q]=1;H[q]=f.id;}
      const bnd=[];
      for(const q of W){ const x=q%G; if(x===0||x===G-1||H[q-1]!==f.id||H[q+1]!==f.id||H[q-G]!==f.id||H[q+G]!==f.id){ bnd.push(q);
        const y=(q/G)|0; for(let i=0;i<disk.length;i+=3){ const xx=x+disk[i+1], yy=y+disk[i+2]; if(xx>=0&&yy>=0&&xx<G&&yy<G) O[q+disk[i]]=1; } } }
      placed.push({id:f.id,k,color:f.color,W,bnd,area:f.pix.length}); usage[k]++; ok=true; break; }
    if (!ok){
      if (f.depth<5 && f.pix.length>2*minA){ // split by polar angle: shorter arcs interleave better on a ring
        const a0=Math.atan2(f.cy-c,f.cx-c), ang=q=>{ let a=Math.atan2(((q/G)|0)+.5-c,q%G+.5-c)-a0; if(a>Math.PI)a-=2*Math.PI; if(a<-Math.PI)a+=2*Math.PI; return a; };
        let key=ang; const span=(()=>{let lo=9,hi=-9; for(const q of f.pix){const a=ang(q); if(a<lo)lo=a; if(a>hi)hi=a;} return (hi-lo)*f.r;})();
        if (span < Math.max(f.x1-f.x0,f.y1-f.y0)*0.6) key=q=>Math.hypot(q%G+.5-c,((q/G)|0)+.5-c);
        const vals=f.pix.map(key).sort((a,b)=>a-b); const m=vals[vals.length>>1];
        const A=[],B=[]; for(const q of f.pix) (key(q)<m?A:B).push(q);
        if (A.length&&B.length){ const g={id:frags.length,color:f.color,pix:B,depth:f.depth+1,alive:true}; frags.push(g); for(const q of B)F[q]=g.id;
          f.pix=A; f.depth++; stat(f); stat(g); queue.splice(qi,0,f,g); continue; }
      }
      failed.push(f);
    }
  }
  // 5. contours in mm, stencil space (origin = centre)
  for (const w of placed){ let x0=G,y0=G,x1=0,y1=0; for(const q of w.W){const x=q%G,y=(q/G)|0; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;}
    const bw=x1-x0+1, bh=y1-y0+1, m=new Uint8Array(bw*bh); for(const q of w.W){ m[((q/G|0)-y0)*bw+(q%G-x0)]=1; }
    w.loops = traceLoops(m,bw,bh).map(l=>smoothClosed(simplifyClosed(l,0.75))).filter(l=>l.length>2&&Math.abs(polyArea(l))>1.5)
      .map(l=>l.map(([x,y])=>[(x+x0-c)*s,(y+y0-c)*s]));
  }
  // 6. labels
  const Dh=distTransform(H,G), fsp=o.font/s, multi=o.paintCount>1, letters='ABCDEF';
  const LG=new Uint8Array(G*G), mg=0.6/s, rimOut=c-1.2/s, rimIn=AXLE/2/s+1/s;
  let lost=0;
  const byArea=placed.slice().sort((a,b)=>a.area-b.area);
  for (const w of byArea){
    w.text=String(w.k+1)+(multi?letters[o.paintIndex[w.color]]:'');
    const rad=Math.max(w.text.length*0.62*fsp,fsp*0.8)/2+0.6;
    const samp=[]; const stp=Math.max(1,Math.floor(w.bnd.length/36)); for(let i=0;i<w.bnd.length;i+=stp) samp.push(w.bnd[i]);
    let bx0=G,by0=G,bx1=0,by1=0; for(const q of w.bnd){const x=q%G,y=(q/G)|0; if(x<bx0)bx0=x; if(x>bx1)bx1=x; if(y<by0)by0=y; if(y>by1)by1=y;}
    let best=null,bs=1e18;
    for (const E of [rad+mg+7/s, rad+mg+18/s]){
      for (let y=Math.max(0,Math.floor(by0-E)); y<=Math.min(G-1,by1+E); y+=2) for (let x=Math.max(0,Math.floor(bx0-E)); x<=Math.min(G-1,bx1+E); x+=2){
        const p=y*G+x, dh=Dh[p]; if(dh<rad+mg) continue;
        const rr=Math.hypot(x+.5-c,y+.5-c); if(rr+rad>rimOut||rr-rad<rimIn) continue;
        if(LG[p]) continue; let hit=false;
        for(let a=0;a<8&&!hit;a++){ const xx=Math.round(x+rad*Math.cos(a*Math.PI/4)), yy=Math.round(y+rad*Math.sin(a*Math.PI/4)); if(xx<0||yy<0||xx>=G||yy>=G||LG[yy*G+xx]) hit=true; }
        if(hit) continue;
        let own=1e9; for(const q of samp){ const d=Math.hypot(q%G-x,((q/G)|0)-y); if(d<own) own=d; }
        const sc=own+1.5*(own-dh); if(sc<bs){bs=sc;best=[x,y];} }
      if(best) break; }
    if(!best){ lost++; best=[Math.round(w.bnd[0]%G),Math.round(w.bnd[0]/G)]; }
    const [lx,ly]=best; const ri=Math.ceil(rad+1.5);
    for(let dy=-ri;dy<=ri;dy++)for(let dx=-ri;dx<=ri;dx++){ if(dx*dx+dy*dy>ri*ri) continue; const xx=lx+dx,yy=ly+dy; if(xx>=0&&yy>=0&&xx<G&&yy<G) LG[yy*G+xx]=1; }
    w.lx=(lx+.5-c)*s; w.ly=(ly+.5-c)*s;
  }
  const placedPx=placed.reduce((a,w)=>a+w.area,0);
  const failedPx=failed.reduce((a,f)=>a+f.pix.length,0);
  for (const w of placed){ delete w.W; delete w.bnd; }
  return { windows:placed, failedCount:failed.length, coverage: totalPx? placedPx/totalPx : 1, failedPx, lostLabels:lost, usage };
}

function traceLoops(m,w,h){ const W1=w+1, next=new Map();
  const add=(a,b)=>{let l=next.get(a); if(!l){l=[];next.set(a,l);} l.push(b);};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){ if(!m[y*w+x]) continue;
    if(y===0||!m[(y-1)*w+x]) add(y*W1+x,y*W1+x+1);
    if(x===w-1||!m[y*w+x+1]) add(y*W1+x+1,(y+1)*W1+x+1);
    if(y===h-1||!m[(y+1)*w+x]) add((y+1)*W1+x+1,(y+1)*W1+x);
    if(x===0||!m[y*w+x-1]) add((y+1)*W1+x,y*W1+x); }
  const loops=[];
  for(const [s0,l] of next){ while(l.length){ const pts=[s0]; let b=l.pop(), guard=0;
      while(b!==s0 && guard++<1e6){ pts.push(b); const nl=next.get(b); if(!nl||!nl.length) break; b=nl.pop(); }
      loops.push(pts.map(v=>[v%W1,Math.floor(v/W1)])); } }
  return loops; }
function rdp(pts,eps){ const n=pts.length; if(n<3) return pts.slice(); const keep=new Uint8Array(n); keep[0]=keep[n-1]=1; const st=[[0,n-1]];
  while(st.length){ const [a,b]=st.pop(); const [ax,ay]=pts[a],[bx,by]=pts[b]; const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1; let md=-1,mi=-1;
    for(let i=a+1;i<b;i++){ const d=Math.abs((pts[i][0]-ax)*dy-(pts[i][1]-ay)*dx)/L; if(d>md){md=d;mi=i;} }
    if(md>eps){keep[mi]=1; st.push([a,mi],[mi,b]);} }
  return pts.filter((_,i)=>keep[i]); }
function simplifyClosed(pts,eps){ const n=pts.length; if(n<5) return pts; let far=0,fd=-1;
  for(let i=1;i<n;i++){ const d=(pts[i][0]-pts[0][0])**2+(pts[i][1]-pts[0][1])**2; if(d>fd){fd=d;far=i;} }
  const a=rdp(pts.slice(0,far+1),eps), b=rdp(pts.slice(far).concat([pts[0]]),eps); return a.slice(0,-1).concat(b.slice(0,-1)); }
function smoothClosed(p){ const n=p.length; if(n<3) return p; const o=[];
  for(let i=0;i<n;i++){ const a=p[i],b=p[(i+1)%n]; o.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]]); } return o; }
function polyArea(p){ let a=0; for(let i=0;i<p.length;i++){const q=p[i],r=p[(i+1)%p.length]; a+=q[0]*r[1]-r[0]*q[1];} return a/2; }
function distTransform(H,n){ const D=new Float32Array(n*n); const INF=1e6, d2=1.4142;
  for(let i=0;i<n*n;i++) D[i]=H[i]>=0?0:INF;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){ const p=y*n+x; let v=D[p]; if(!v) continue;
    if(x>0) v=Math.min(v,D[p-1]+1); if(y>0){ v=Math.min(v,D[p-n]+1); if(x>0) v=Math.min(v,D[p-n-1]+d2); if(x<n-1) v=Math.min(v,D[p-n+1]+d2);} D[p]=v; }
  for(let y=n-1;y>=0;y--)for(let x=n-1;x>=0;x--){ const p=y*n+x; let v=D[p]; if(!v) continue;
    if(x<n-1) v=Math.min(v,D[p+1]+1); if(y<n-1){ v=Math.min(v,D[p+n]+1); if(x<n-1) v=Math.min(v,D[p+n+1]+d2); if(x>0) v=Math.min(v,D[p+n-1]+d2);} D[p]=v; }
  return D; }
function loopsToD(loops){ return loops.map(l=>'M'+l.map(([x,y])=>x.toFixed(2)+' '+y.toFixed(2)).join('L')+'Z').join(''); }
/* ===================== end core ===================== */

const PRESET = {
  hand:  { line:2.2, bridge:2.5, piece:16, minArea:10, font:3.2, rim:7, hint:'hintHand' },
  laser: { line:1.4, bridge:1.2, piece:10, minArea:3,  font:2.4, rim:5, hint:'hintLaser' }
};
const S = { style:'line', line:2.2, edgeD:null, mode:'hand', D:150, N:24, K:4, piece:16, bridge:2.5, zoom:1, seed:1, img:null, imgName:'',
  palette:[], idx:null, paint:new Set(), layout:null, step:14, phi:0, active:-1, alpha:0, lift:false };
const $ = id=>document.getElementById(id);
const src = document.createElement('canvas'); src.width=src.height=G;
const sctx = src.getContext('2d', { willReadFrequently:true });

function drawSample(ctx,W){
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,W);
  ctx.save(); ctx.translate(W/2,W/2); ctx.scale(.82,.82); ctx.translate(-W/2,-W/2); const u=W/100;
  const P=(pts)=>{ctx.beginPath(); ctx.moveTo(pts[0]*u,pts[1]*u); for(let i=2;i<pts.length;i+=6) ctx.bezierCurveTo(pts[i]*u,pts[i+1]*u,pts[i+2]*u,pts[i+3]*u,pts[i+4]*u,pts[i+5]*u); ctx.closePath(); ctx.fill();};
  ctx.fillStyle='#2f6fd6'; P([16,58, 14,32,40,24,58,31, 72,36,78,47,80,55, 84,48,89,42,94,40, 93,49,91,55,86,59, 91,63,94,70,94,75, 88,73,83,69,79,64, 70,77,50,81,36,78, 24,75,17,67,16,58]);
  ctx.fillStyle='#9ccbff'; P([20,64, 34,71,56,71,73,63, 63,75,44,79,31,75, 26,73,22,69,20,64]);
  ctx.fillStyle='#2f6fd6'; P([46,70, 50,74,52,80,48,86, 44,82,42,76,46,70]);
  ctx.fillStyle='#0f2347'; ctx.beginPath(); ctx.arc(32*u,51*u,3.4*u,0,7); ctx.fill();
  ctx.lineWidth=2.2*u; ctx.lineCap='round'; ctx.strokeStyle='#0f2347'; ctx.beginPath(); ctx.moveTo(22*u,60*u); ctx.quadraticCurveTo(28*u,63*u,34*u,61*u); ctx.stroke();
  ctx.fillStyle='#9ccbff'; [[42,15,4],[50,9,4.4],[58,15,4],[50,21,3]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x*u,y*u,r*u,0,7);ctx.fill();});
  ctx.fillStyle='#0f2347'; [[30,90,3],[40,93,2.4],[62,92,3],[72,88,2.4]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x*u,y*u,r*u,0,7);ctx.fill();});
  ctx.restore();
}

function renderSource(){
  sctx.setTransform(1,0,0,1,0,0);
  if(!S.img){ drawSample(sctx,G); }
  else { sctx.fillStyle='#fff'; sctx.fillRect(0,0,G,G); const im=S.img, sc=Math.max(G/im.width,G/im.height)*S.zoom;
    const w=im.width*sc, h=im.height*sc; sctx.drawImage(im,(G-w)/2,(G-h)/2,w,h); }
  if(!S.img && S.zoom!==1){ const tmp=document.createElement('canvas'); tmp.width=tmp.height=G; tmp.getContext('2d').drawImage(src,0,0);
    sctx.fillStyle='#fff'; sctx.fillRect(0,0,G,G); const w=G*S.zoom; sctx.drawImage(tmp,(G-w)/2,(G-w)/2,w,w); }
  const t=$('thumb').getContext('2d'); t.clearRect(0,0,128,128); t.save(); t.beginPath(); t.arc(64,64,64,0,7); t.clip(); t.drawImage(src,0,0,128,128); t.restore();
}

function quantize(){
  const d=sctx.getImageData(0,0,G,G).data, c=G/2, K=S.K, rnd=rngOf(7);
  const px=[]; for(let y=0;y<G;y+=3)for(let x=0;x<G;x+=3){ if(Math.hypot(x-c,y-c)>c) continue; const i=(y*G+x)*4, a=d[i+3]/255;
    px.push([d[i]*a+255*(1-a), d[i+1]*a+255*(1-a), d[i+2]*a+255*(1-a)]); }
  const cen=[px[Math.floor(rnd()*px.length)].slice()];
  while(cen.length<K){ let sum=0; const ds=px.map(p=>{let m=1e18; for(const q of cen){const e=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2; if(e<m)m=e;} sum+=m; return m;});
    let r=rnd()*sum, i=0; for(;i<ds.length-1;i++){ r-=ds[i]; if(r<=0) break; } cen.push(px[i].slice()); }
  for(let it=0;it<14;it++){ const acc=cen.map(()=>[0,0,0,0]);
    for(const p of px){ let m=1e18,b=0; cen.forEach((q,j)=>{const e=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2; if(e<m){m=e;b=j;}}); const A=acc[b]; A[0]+=p[0];A[1]+=p[1];A[2]+=p[2];A[3]++; }
    acc.forEach((A,j)=>{ if(A[3]) cen[j]=[A[0]/A[3],A[1]/A[3],A[2]/A[3]]; }); }
  const lum=q=>.299*q[0]+.587*q[1]+.114*q[2];
  cen.sort((a,b)=>lum(b)-lum(a));
  let idx=new Int8Array(G*G);
  for(let p=0;p<G*G;p++){ const i=p*4, a=d[i+3]/255, r=d[i]*a+255*(1-a), g=d[i+1]*a+255*(1-a), b=d[i+2]*a+255*(1-a); let m=1e18,bi=0;
    for(let j=0;j<K;j++){ const q=cen[j], e=(r-q[0])**2+(g-q[1])**2+(b-q[2])**2; if(e<m){m=e;bi=j;} } idx[p]=bi; }
  for(let pass=0;pass<2;pass++){ const nx=new Int8Array(idx); const cnt=new Int32Array(K);
    for(let y=1;y<G-1;y++)for(let x=1;x<G-1;x++){ cnt.fill(0); for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++) cnt[idx[(y+dy)*G+x+dx]]++;
      let bi=idx[y*G+x],bc=cnt[bi]; for(let j=0;j<K;j++) if(cnt[j]>bc){bc=cnt[j];bi=j;} nx[y*G+x]=bi; } idx=nx; }
  S.palette=cen.map(q=>'#'+q.map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''));
  S.idx=idx; S.edgeD=null; S.paint=new Set(S.palette.map((_,i)=>i).filter(i=>i>0));
  renderSwatches();
}

function renderSwatches(){
  const box=$('swatches'); box.innerHTML='';
  const order=[...S.paint].sort((a,b)=>a-b); const letters='ABCDEF';
  S.palette.forEach((col,i)=>{ const b=document.createElement('button'); const on=S.paint.has(i);
    b.setAttribute('aria-pressed',on); b.innerHTML=`<i style="background:${col}"></i>${on?(order.length>1?t('swPaint')+' '+letters[order.indexOf(i)]:t('swPaintOne')):t('swPaper')}`;
    b.onclick=()=>{ if(S.paint.has(i)) S.paint.delete(i); else S.paint.add(i); if(!S.paint.size) S.paint.add(i); renderSwatches(); schedule(); };
    box.appendChild(b); });
}

function paintMap(){
  const pr=PRESET[S.mode], s=S.D/G, c=G/2, Rp=c-pr.rim/s, rc=(AXLE/2+S.bridge+1.5)/s;
  const P=new Int8Array(G*G).fill(-1), idx=S.idx, line=S.style==='line';
  if(line && !S.edgeD){ const B=new Int32Array(G*G).fill(-1);
    for(let y=1;y<G-1;y++)for(let x=1;x<G-1;x++){ const p=y*G+x,k=idx[p]; if(idx[p-1]!==k||idx[p+1]!==k||idx[p-G]!==k||idx[p+G]!==k) B[p]=0; }
    S.edgeD=distTransform(B,G); }
  const lw=S.line/s;
  for(let y=0;y<G;y++)for(let x=0;x<G;x++){ const r=Math.hypot(x+.5-c,y+.5-c); if(r>Rp||r<rc) continue; const p=y*G+x;
    if(S.paint.has(idx[p]) && (!line || S.edgeD[p]<=lw)) P[p]=idx[p]; }
  return P;
}

let timer=null;
function schedule(){ clearTimeout(timer); $('busy').hidden=false; timer=setTimeout(compute,180); }
function compute(){
  const pr=PRESET[S.mode]; const order=[...S.paint].sort((a,b)=>a-b); const paintIndex={}; order.forEach((c,i)=>paintIndex[c]=i);
  const t0=performance.now();
  S.layout=buildLayout(paintMap(),{D:S.D,N:S.N,piece:S.piece,bridge:S.bridge,minArea:pr.minArea,font:pr.font,seed:S.seed,paintCount:order.length,paintIndex});
  S.layout.ms=performance.now()-t0;
  S.layout.windows.forEach(w=>{ w.path=new Path2D(loopsToD(w.loops)); w.fill=S.palette[w.color]; });
  S.paintOrder=order;
  buildSheets(); renderStats();
  $('step').max=S.N; S.step=Math.min(S.step,S.N); $('step').value=S.step; setStep(S.step);
  $('busy').hidden=true;
}

/* ===================== sheets (SVG, mm) ===================== */
function geom(){ const R=S.D/2; return { R, tab:5, tickIn:R+1, tickOut:R+4.5, numR:R+9, baseR:R+13 }; }
function stencilOutlinePts(){ const {R,tab}=geom(); const d=Math.asin(4/R); const pts=[]; const a0=-Math.PI/2+d, a1=-Math.PI/2-d+2*Math.PI;
  for(let i=0;i<=240;i++){ const a=a0+(a1-a0)*i/240; pts.push([R*Math.cos(a),R*Math.sin(a)]); } pts.push([0,-(R+tab)]); return pts; }
function buildSheets(){
  const g=geom(), L=S.layout, laser=S.mode==='laser', pr=PRESET[S.mode];
  const cut=laser?'fill="none" stroke="#ff0000" stroke-width="0.05"':'fill="none" stroke="#111" stroke-width="0.3"';
  const win=laser?'fill="none" stroke="#ff0000" stroke-width="0.05"':'fill="#d9dde3" stroke="#111" stroke-width="0.25"';
  const txt=laser?'#0000ff':'#111';
  const W=2*(g.R+g.tab+3);
  const outline='M'+stencilOutlinePts().map(([x,y])=>x.toFixed(2)+' '+y.toFixed(2)).join('L')+'Z';
  let st=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${W}mm" viewBox="${-W/2} ${-W/2} ${W} ${W}">`;
  st+=`<path d="${outline}" ${cut} fill-rule="evenodd"/>`;
  st+=`<circle cx="0" cy="0" r="${AXLE/2}" ${cut}/>`;
  st+=`<path d="${L.windows.map(w=>loopsToD(w.loops)).join('')}" ${win} fill-rule="evenodd"/>`;
  for(const w of L.windows){ const deg=-(w.k*360/S.N); st+=`<text x="${w.lx.toFixed(2)}" y="${(w.ly+pr.font*0.36).toFixed(2)}" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="${pr.font}" text-anchor="middle" fill="${txt}" transform="rotate(${deg.toFixed(2)} ${w.lx.toFixed(2)} ${w.ly.toFixed(2)})">${w.text}</text>`; }
  st+=`</svg>`;
  const multi=S.paintOrder.length>1, letters='ABCDEF', legendH=multi?14:0;
  const BW=2*(g.baseR+2), BH=BW+legendH;
  let bs=`<svg xmlns="http://www.w3.org/2000/svg" width="${BW}mm" height="${BH}mm" viewBox="${-BW/2} ${-BW/2} ${BW} ${BH}">`;
  bs+=`<circle cx="0" cy="0" r="${g.R}" fill="none" stroke="#999" stroke-width="0.25" stroke-dasharray="1.5 1.5"/>`;
  bs+=`<path d="M-4 0H4M0 -4V4" stroke="#111" stroke-width="0.3"/><circle cx="0" cy="0" r="${AXLE/2}" fill="none" stroke="#111" stroke-width="0.2"/>`;
  for(let k=0;k<S.N;k++){ const a=k*2*Math.PI/S.N, sx=Math.sin(a), cy=-Math.cos(a);
    bs+=`<line x1="${(g.tickIn*sx).toFixed(2)}" y1="${(g.tickIn*cy).toFixed(2)}" x2="${(g.tickOut*sx).toFixed(2)}" y2="${(g.tickOut*cy).toFixed(2)}" stroke="#111" stroke-width="0.4"/>`;
    bs+=`<text x="${(g.numR*sx).toFixed(2)}" y="${(g.numR*cy+1.2).toFixed(2)}" font-family="Arial, Helvetica, sans-serif" font-size="3.4" font-weight="700" text-anchor="middle" fill="#111">${k+1}</text>`; }
  if(multi){ const n=S.paintOrder.length, sp=26, x0=-(n-1)*sp/2, y=g.baseR+8;
    S.paintOrder.forEach((c,i)=>{ const x=x0+i*sp; bs+=`<rect x="${x-9}" y="${y-3.5}" width="7" height="7" rx="1" fill="${S.palette[c]}" stroke="#111" stroke-width="0.2"/><text x="${x+1}" y="${y+1.4}" font-family="Arial, Helvetica, sans-serif" font-size="4" font-weight="700" fill="#111">${letters[i]}</text>`; }); }
  bs+=`</svg>`;
  S.svgStencil=st; S.svgBase=bs;
  $('svgStencil').innerHTML=st; $('svgBase').innerHTML=bs;
  for(const el of [$('svgStencil').firstChild,$('svgBase').firstChild]){ el.removeAttribute('width'); el.removeAttribute('height'); }
}

function renderStats(){
  const L=S.layout, used=L.usage.filter(u=>u>0).length;
  const cov=Math.round(L.coverage*1000)/10;
  let h=`<div class="stat"><span>${t('stWin')}</span><b>${L.windows.length}</b></div>
  <div class="stat"><span>${t('stPos')}</span><b>${used} / ${S.N}</b></div>
  <div class="stat"><span>${t('stCov')}</span><b>${cov}%</b></div>
  <div class="stat"><span>${t('stBase')}</span><b>${Math.round(2*geom().baseR)} ${t('mm')}</b></div>`;
  if(L.failedCount) h+= S.style==='fill'&&L.coverage<0.9
    ? `<p class="warn">${t('warnSolid')}</p>`
    : `<p class="warn">${t('warnFail',L.failedCount)}</p>`;
  if(2*(geom().baseR+2)>200) h+=`<p class="warn">${t('warnA4')}</p>`;
  $('stats').innerHTML=h;
}

/* ===================== simulation ===================== */
const sim=$('sim'), cx=sim.getContext('2d');
let stencilPath=null;
function sizeSim(){ const r=sim.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1); sim.width=Math.round(r.width*dpr); sim.height=Math.round(r.height*dpr); draw(); }
function draw(){
  if(!S.layout) return; const g=geom(), W=sim.width, sc=W/(2*(g.baseR+3)); const L=S.layout;
  cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,W,W); cx.setTransform(sc,0,0,sc,W/2,W/2);
  cx.save(); cx.shadowColor='rgba(0,0,0,.35)'; cx.shadowBlur=14/sc*2; cx.shadowOffsetY=3/sc*2;
  cx.fillStyle='#fbfbf7'; cx.beginPath(); cx.arc(0,0,g.baseR,0,7); cx.fill(); cx.restore();
  cx.lineWidth=0.4; cx.font='700 3.4px Arial, sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
  for(let k=0;k<S.N;k++){ const a=k*2*Math.PI/S.N, sx=Math.sin(a), cy=-Math.cos(a), hot=k===S.active;
    cx.strokeStyle=hot?'#e2560b':'#222'; cx.fillStyle=hot?'#e2560b':'#222';
    cx.beginPath(); cx.moveTo(g.tickIn*sx,g.tickIn*cy); cx.lineTo(g.tickOut*sx,g.tickOut*cy); cx.stroke(); cx.fillText(k+1,g.numR*sx,g.numR*cy); }
  for(const w of L.windows){ if(w.k<S.step){ cx.save(); cx.rotate(w.k*2*Math.PI/S.N); cx.fillStyle=w.fill; cx.fill(w.path,'evenodd'); cx.restore(); } }
  if(S.lift) return;
  if(!stencilPath){ const p=new Path2D('M'+stencilOutlinePts().map(([x,y])=>x.toFixed(2)+' '+y.toFixed(2)).join('L')+'Z'); stencilPath=p; }
  cx.save(); cx.rotate(S.phi);
  const full=new Path2D(); full.addPath(stencilPath); for(const w of L.windows) full.addPath(w.path);
  full.addPath(new Path2D(`M${AXLE/2} 0A${AXLE/2} ${AXLE/2} 0 1 0 ${-AXLE/2} 0A${AXLE/2} ${AXLE/2} 0 1 0 ${AXLE/2} 0Z`));
  cx.shadowColor='rgba(0,0,0,.25)'; cx.shadowBlur=6; cx.fillStyle='rgba(255,255,255,.93)'; cx.fill(full,'evenodd'); cx.shadowColor='transparent';
  cx.strokeStyle='rgba(30,40,36,.55)'; cx.lineWidth=0.25; cx.stroke(full);
  if(S.active>=0&&S.alpha>0){ cx.globalAlpha=S.alpha; for(const w of L.windows) if(w.k===S.active){ cx.fillStyle=w.fill; cx.fill(w.path,'evenodd'); } cx.globalAlpha=1; }
  const pf=PRESET[S.mode].font; cx.font=`700 ${pf}px Arial, sans-serif`;
  for(const w of L.windows){ cx.save(); cx.translate(w.lx,w.ly); cx.rotate(-w.k*2*Math.PI/S.N); cx.fillStyle=w.k===S.active?'#e2560b':'rgba(20,28,25,.75)'; cx.fillText(w.text,0,0); cx.restore(); }
  cx.restore();
}
function setStep(n){ S.step=n; const k=Math.min(n,S.N-1); S.active=n<S.N?k:-1; S.phi=k*2*Math.PI/S.N; S.alpha=0;
  $('posO').textContent=n<S.N?t('mark',n+1):t('done'); draw(); }

let anim=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){
  if(anim){ cancelAnimationFrame(anim); anim=null; $('play').textContent=t('play'); return; }
  if(S.step>=S.N){ S.step=0; }
  S.lift=false; $('lift').checked=false; $('play').textContent=t('pause');
  let phase='turn', t0=performance.now(), from=S.phi;
  const target=()=>S.step*2*Math.PI/S.N;
  const tick=(now)=>{
    const tt=reduce?1:Math.min(1,(now-t0)/(phase==='turn'?420:340));
    if(phase==='turn'){ let to=target(); if(to<from-1e-6) to+=2*Math.PI; const e=tt<.5?2*tt*tt:1-(-2*tt+2)**2/2; S.phi=from+(to-from)*e; S.active=S.step; S.alpha=0;
      if(tt>=1){ phase='paint'; t0=now; } }
    else { S.alpha=tt; if(tt>=1){ S.step++; $('step').value=S.step; $('posO').textContent=S.step<S.N?t('mark',S.step+1):t('done');
        if(S.step>=S.N){ S.active=-1; S.lift=true; $('lift').checked=true; draw(); anim=null; $('play').textContent=t('play'); return; }
        phase='turn'; t0=now; from=S.phi%(2*Math.PI); } }
    draw(); anim=requestAnimationFrame(tick); };
  anim=requestAnimationFrame(tick);
}

/* ===================== export ===================== */
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
let downloads=null;
(async()=>{ try{ downloads = window.claude ? await window.claude.use('downloads') : null; }catch(e){ downloads=null; } })();
async function save(filename,data){
  if(downloads){ try{ await downloads.save({filename,data}); toast(t('tSaved',filename)); }catch(e){ if(e&&e.code==='declined') return; toast(t('tSaveFail',(e&&e.message)||'error')); } return; }
  if(!window.claude){ // plain website (e.g. GitHub Pages): normal browser download
    const mime=filename.endsWith('.pdf')?'application/pdf':'image/svg+xml';
    const url=URL.createObjectURL(new Blob([data],{type:mime})); const el=document.createElement('a'); el.href=url; el.download=filename;
    document.body.appendChild(el); el.click(); el.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast(t('tSaved',filename)); return; }
  if(typeof data==='string'){ try{ await navigator.clipboard.writeText(data); toast(t('tCopied')); }catch(e){ toast(t('tNoDl')); } }
  else toast(t('tNoDl'));
}
function hexRGB(h){ return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); }
function makePdf(){
  if(!window.jspdf){ toast(t('tNoPdf')); return null; }
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'}); const g=geom(), pr=PRESET[S.mode], laser=S.mode==='laser';
  const ox=105, oy=140; const poly=(pts,style)=>{ const d=[]; for(let i=1;i<pts.length;i++) d.push([pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]]); doc.lines(d,ox+pts[0][0],oy+pts[0][1],[1,1],style,true); };
  doc.setFont('helvetica','bold');
  doc.setFontSize(10); doc.setTextColor(0); doc.text(`STENCIL  ${S.D} mm  /  ${S.N} positions  -  cut along the lines, cut out all grey windows`,15,15);
  doc.setDrawColor(laser?255:17,laser?0:17,laser?0:17); doc.setLineWidth(laser?0.05:0.3);
  poly(stencilOutlinePts(),'S'); doc.circle(ox,oy,AXLE/2,'S');
  doc.setFillColor(217,221,227); doc.setLineWidth(laser?0.05:0.25);
  for(const w of S.layout.windows) for(const l of w.loops) poly(l, laser?'S':'FD');
  doc.setFontSize(pr.font/0.3528); doc.setTextColor(laser?0:17, laser?0:17, laser?255:17);
  for(const w of S.layout.windows){ const th=w.k*2*Math.PI/S.N, tw=doc.getTextWidth(w.text), dx=-tw/2, dy=pr.font*0.36;
    const x=ox+w.lx+dx*Math.cos(th)+dy*Math.sin(th), y=oy+w.ly-dx*Math.sin(th)+dy*Math.cos(th); doc.text(w.text,x,y,{angle:w.k*360/S.N}); }
  doc.addPage(); doc.setTextColor(0); doc.setFontSize(10); doc.text(`BASE  -  pin through the cross, turn the stencil arrow to each mark and colour its windows`,15,15);
  doc.setDrawColor(150); doc.setLineWidth(0.25); doc.setLineDashPattern([1.5,1.5],0); doc.circle(ox,oy,g.R,'S'); doc.setLineDashPattern([],0);
  doc.setDrawColor(17); doc.setLineWidth(0.3); doc.line(ox-4,oy,ox+4,oy); doc.line(ox,oy-4,ox,oy+4); doc.circle(ox,oy,AXLE/2,'S');
  doc.setLineWidth(0.4); doc.setFontSize(3.4/0.3528);
  for(let k=0;k<S.N;k++){ const a=k*2*Math.PI/S.N, sx=Math.sin(a), cy=-Math.cos(a); doc.line(ox+g.tickIn*sx,oy+g.tickIn*cy,ox+g.tickOut*sx,oy+g.tickOut*cy);
    const t=String(k+1), tw=doc.getTextWidth(t); doc.text(t,ox+g.numR*sx-tw/2,oy+g.numR*cy+1.2); }
  if(S.paintOrder.length>1){ const n=S.paintOrder.length, sp=26, x0=ox-(n-1)*sp/2, y=oy+g.baseR+8; doc.setFontSize(4/0.3528);
    S.paintOrder.forEach((c,i)=>{ const x=x0+i*sp; doc.setFillColor(...hexRGB(S.palette[c])); doc.setLineWidth(0.2); doc.rect(x-9,y-3.5,7,7,'FD'); doc.text('ABCDEF'[i],x+1,y+1.4); }); }
  return doc.output('arraybuffer');
}
