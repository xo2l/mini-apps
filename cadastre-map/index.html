<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadastre Map KZ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed map, operator panel on the right (bottom sheet on phones), coordinate strip bottom-left */
:root{
  --bg:#f3f4f0; --panel:#ffffff; --fg:#1b221d; --muted:#667066; --line:#dde1d8; --hover:#eef1ea;
  --accent:#0b7f86; --accent-ink:#ffffff; --warn:#b8432f;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101412; --panel:#171c19; --fg:#e3e8e1; --muted:#97a195; --line:#2b332d; --hover:#202722;
  --accent:#3fc0c6; --accent-ink:#0d1413; --warn:#ec7b66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --panel:#171c19; --fg:#e3e8e1; --muted:#97a195; --line:#2b332d; --hover:#202722;
  --accent:#3fc0c6; --accent-ink:#0d1413; --warn:#ec7b66; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body)}
[hidden]{display:none!important}
#map{position:fixed;inset:0;background:#d9dccf}
.panel{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));
  width:340px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);
  display:flex;flex-direction:column;overflow:hidden}
.panel.collapsed{bottom:auto}
.panel.collapsed .body,.panel.collapsed .tabs{display:none}
.head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.head h1{font:600 15px var(--f-body);margin:0;flex:1;min-width:0}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;padding:1px;gap:1px}
.lang button{border:0;background:transparent;color:var(--muted);font:500 11px var(--f-mono);letter-spacing:.05em;padding:3px 6px;border-radius:5px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:4px 9px;font:500 12.5px var(--f-body);cursor:pointer}
.iconbtn:hover{background:var(--hover)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:500 13px var(--f-body);padding:8px 6px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.body{overflow:auto;padding:4px 0 12px}
section{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
section:last-child{border-bottom:0}
h2{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
h3{font:600 12.5px var(--f-body);color:var(--muted);margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--hover);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.chip button:hover{color:var(--warn)}
.row{display:flex;gap:6px;align-items:center}
select,input[type=text]{width:100%;min-width:0;font:13px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.lyr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;padding:3px 0}
.lyr label{cursor:pointer;min-width:0}
.lyr input[type=range]{grid-column:2/4;width:100%;height:16px;accent-color:var(--accent)}
.lyr .lg{font:12px var(--f-body);color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
.lyr .legend{grid-column:2/4;max-width:100%;overflow:auto;background:#fff;border-radius:4px;padding:4px}
.lyr .legend img{display:block;max-width:100%}
.base{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.base small{color:var(--muted)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.note{font-size:12.5px;color:var(--muted);margin:0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--panel);color:var(--warn);border:1px solid var(--line)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:7px 8px;font:500 12.5px var(--f-body);cursor:pointer;text-align:left}
.tool:hover{background:var(--hover)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tool.wide{grid-column:1/3}
.hint{font-size:12.5px;background:var(--hover);border-left:3px solid var(--accent);padding:6px 8px;border-radius:4px}
.grid2{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:0}
.grid2 dt{color:var(--muted)} .grid2 dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.nums label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
input[type=number]{width:100%;min-width:0;font:13px var(--f-mono);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.presets{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.presets button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:2px 9px;font:12px var(--f-body);cursor:pointer}
.presets button:hover{background:var(--hover)}
.shape{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.shape:hover{background:var(--hover)}
.shape.sel{border-color:var(--accent)}
.shape .sw{width:12px;height:12px;border-radius:2px;flex:none}
.shape .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shape .ar{font:12px var(--f-mono);color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.tbl table{border-collapse:collapse;width:100%;font:11.5px var(--f-mono);font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{font:500 10.5px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--hover)}
.warnbox{font-size:12.5px;color:var(--warn)}
.links{display:flex;flex-direction:column;gap:3px;font-size:13px}
.links a,.pop a{color:var(--accent)}
.coords{position:fixed;z-index:1000;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font:12px var(--f-mono);font-variant-numeric:tabular-nums;pointer-events:none}
.leaflet-container{font:13px var(--f-body)}
.leaflet-container.drawing{cursor:crosshair}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg)}
.pop{display:flex;flex-direction:column;gap:6px;min-width:230px}
.pop .mono{font:12px var(--f-mono);font-variant-numeric:tabular-nums}
.vtx{width:12px;height:12px;margin:-6px 0 0 -6px;background:#fff;border:2px solid #ff3b7f;border-radius:50%;box-shadow:0 0 2px #000}
.mid{margin:0;white-space:nowrap;font:600 11px var(--f-mono);color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000;cursor:copy}
.mid i{display:inline-block;width:8px;height:8px;margin-right:3px;background:#ff3b7f;border:1px solid #fff;vertical-align:-1px}
.shapelbl{background:rgba(0,0,0,.55);border:0;color:#fff;font:600 12px var(--f-body);box-shadow:none;padding:2px 6px}
.shapelbl::before,.rulerlbl::before{display:none}
.rulerlbl{background:#111;color:#ffe14d;border:0;font:600 12px var(--f-mono);box-shadow:none}
@media (max-width:640px){
  .panel{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));width:auto;max-height:62vh}
  .coords{bottom:auto;top:max(8px,env(safe-area-inset-top,0px));left:56px;right:max(8px,env(safe-area-inset-right,0px));font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<div class="coords" id="coords">—</div>

<aside class="panel" id="panel">
  <div class="head">
    <h1 data-i18n="title"></h1>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="ru" aria-pressed="false">RU</button></div>
    <button class="iconbtn" id="toggle" aria-expanded="true" type="button" data-i18n="collapse"></button>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabL" aria-selected="true" aria-controls="paneLayers" data-i18n="tabLayers"></button>
    <button type="button" role="tab" id="tabD" aria-selected="false" aria-controls="paneDraw" data-i18n="tabDraw"></button>
  </div>

  <div class="body" id="paneLayers" role="tabpanel">
    <section>
      <h2 data-i18n="hBase"></h2>
      <div id="baseList"></div>
    </section>
    <section>
      <h2 data-i18n="hDistricts"></h2>
      <div class="chips" id="chips"></div>
      <div class="row">
        <select id="distSel" data-i18n-aria="addDistAria"></select>
        <button class="btn" id="addDist" type="button" data-i18n="add"></button>
      </div>
      <p class="note" data-i18n="distNote"></p>
    </section>
    <section>
      <h2 data-i18n="hLayers"></h2>
      <div id="egknList"></div>
    </section>
    <section>
      <h2 data-i18n="hGoto"></h2>
      <div class="row">
        <input type="text" id="goto" placeholder="53.2144, 63.6246" data-i18n-aria="gotoAria">
        <button class="btn" id="gotoBtn" type="button" data-i18n="find"></button>
      </div>
      <p class="note" data-i18n="clickNote"></p>
    </section>
  </div>

  <div class="body" id="paneDraw" role="tabpanel" hidden>
    <section>
      <h2 data-i18n="hTools"></h2>
      <div class="tools">
        <button type="button" class="tool" id="tPoly" aria-pressed="false" data-i18n="tPoly"></button>
        <button type="button" class="tool" id="tRect" aria-pressed="false" data-i18n="tRect"></button>
        <button type="button" class="tool wide" id="tRuler" aria-pressed="false" data-i18n="tRuler"></button>
      </div>
      <div class="hint" id="drawHint" hidden></div>
      <div id="rectForm" hidden>
        <div class="nums">
          <label><span data-i18n="rWidth"></span><input type="number" id="rW" value="30" min="1" step="0.5"></label>
          <label><span data-i18n="rLength"></span><input type="number" id="rL" value="50" min="1" step="0.5"></label>
          <label><span data-i18n="rAngle"></span><input type="number" id="rA" value="0" min="-180" max="180" step="1"></label>
        </div>
        <div class="presets">
          <button type="button" data-w="25" data-l="40">0.10 ha · 25×40</button>
          <button type="button" data-w="30" data-l="50">0.15 ha · 30×50</button>
          <button type="button" data-w="40" data-l="50">0.20 ha · 40×50</button>
          <button type="button" data-w="50" data-l="50">0.25 ha · 50×50</button>
          <button type="button" data-w="50" data-l="100">0.50 ha · 50×100</button>
          <button type="button" data-w="100" data-l="100">1 ha · 100×100</button>
        </div>
        <p class="note" id="rArea" style="margin-top:6px"></p>
      </div>
    </section>

    <section>
      <h2 data-i18n="hShapes"></h2>
      <div id="shapeList"></div>
      <div class="btnrow">
        <label class="btn ghost" style="cursor:pointer"><span data-i18n="import"></span><input type="file" id="impFile" accept=".geojson,.json,.kml" hidden></label>
      </div>
    </section>

    <section id="shapeInfo" hidden>
      <h2 data-i18n="hSelected"></h2>
      <input type="text" id="sName" data-i18n-aria="nameAria">
      <select id="sPurpose" data-i18n-aria="purposeAria"></select>
      <dl class="grid2" id="sStats"></dl>
      <div class="warnbox" id="sWarn" hidden></div>
      <label class="note" for="sRot" data-i18n="rotNote"></label>
      <input type="range" id="sRot" min="-90" max="90" step="0.5" value="0" style="accent-color:var(--accent)">
      <p class="note" data-i18n="editNote"></p>
      <div class="btnrow">
        <button type="button" class="btn" id="sPrint" data-i18n="print"></button>
        <button type="button" class="btn ghost" id="sCopy" data-i18n="copy"></button>
        <button type="button" class="btn ghost" id="sZoom" data-i18n="zoom"></button>
        <button type="button" class="btn danger" id="sDel" data-i18n="del"></button>
      </div>
      <div class="links" id="sLinks"></div>
      <h3 data-i18n="hCatalog"></h3>
      <div class="tbl"><table id="sTable"></table></div>
    </section>

    <section>
      <h2 data-i18n="hExport"></h2>
      <div class="btnrow">
        <button type="button" class="btn ghost" id="eKml">KML</button>
        <button type="button" class="btn ghost" id="eGeo">GeoJSON</button>
        <button type="button" class="btn ghost" id="eCsv">CSV (Excel)</button>
      </div>
      <p class="note" data-i18n="calcNote"></p>
    </section>
  </div>
</aside>

// ---------------------------------------------------------------- geodesy
function utm(lat,lon,zoneIn){
  const zone=zoneIn||Math.floor((lon+180)/6)+1,a=6378137,f=1/298.257223563,k0=.9996,e2=f*(2-f),ep2=e2/(1-e2),l0=((zone-1)*6-180+3)*Math.PI/180;
  const p=lat*Math.PI/180,l=lon*Math.PI/180,N=a/Math.sqrt(1-e2*Math.sin(p)**2),T=Math.tan(p)**2,C=ep2*Math.cos(p)**2,A=Math.cos(p)*(l-l0);
  const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*p-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*p)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*p)-(35*e2**3/3072)*Math.sin(6*p));
  const E=500000+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120);
  const Nn=k0*(M+N*Math.tan(p)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
  return {zone,E,N:Nn};
}
function utmInv(E,N,zone){
  const a=6378137,f=1/298.257223563,k0=.9996,e2=f*(2-f),ep2=e2/(1-e2),lon0=((zone-1)*6-180+3)*Math.PI/180;
  const x=E-500000,M=N/k0,mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2**3/256)),e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu);
  const C1=ep2*Math.cos(p1)**2,T1=Math.tan(p1)**2,N1=a/Math.sqrt(1-e2*Math.sin(p1)**2),R1=a*(1-e2)/(1-e2*Math.sin(p1)**2)**1.5,D=x/(N1*k0);
  const lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const lon=lon0+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(p1);
  return [lat*180/Math.PI,lon*180/Math.PI];
}
const zoneOf=ll=>Math.floor((ll[1]+180)/6)+1;
const kScale=E=>0.9996*(1+((E-500000)**2)/(2*6371000**2));
const dms=deg=>{deg=(deg%360+360)%360;const d=Math.floor(deg),m0=(deg-d)*60,m=Math.floor(m0),s=Math.round((m0-m)*60);
  return s===60?`${d}°${String(m+1).padStart(2,'0')}′00″`:`${d}°${String(m).padStart(2,'0')}′${String(s).padStart(2,'0')}″`};

// requested in UTM and warped onto the map tile with an affine transform.

// EGKN moved to QazTRF-23 / Gauss-Kruger (EPSG:10942-10949, GRS80, k=1) in October 2026.
function tmFwd(lat,lon,lon0deg,k0,x0){
  const a=6378137,f=1/298.257222101,e2=f*(2-f),ep2=e2/(1-e2),l0=lon0deg*Math.PI/180;
  const p=lat*Math.PI/180,l=lon*Math.PI/180,N=a/Math.sqrt(1-e2*Math.sin(p)**2),T=Math.tan(p)**2,C=ep2*Math.cos(p)**2,A=Math.cos(p)*(l-l0);
  const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*p-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*p)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*p)-(35*e2**3/3072)*Math.sin(6*p));
  return [x0+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120),
          k0*(M+N*Math.tan(p)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720))];
}
function qazSrs(s){return (s>=32639&&s<=32645)?10904+(s-32600):s}
function srsFwd(srs,lat,lon){
  if(srs>=10942&&srs<=10949){const i=srs-10942;return tmFwd(lat,lon,45+6*i,1,8500000+1e6*i)}
  const u=utm(lat,lon,srs-32600);return [u.E,u.N];
}

L.UtmWms=L.GridLayer.extend({
  initialize(url,params,opts){this._url=url;this._p=params;L.setOptions(this,opts);},
  createTile(coords,done){
    const ts=this.getTileSize(),cv=L.DomUtil.create('canvas','leaflet-tile');cv.width=ts.x;cv.height=ts.y;
    const map=this._map,srs=this.options.srs,nw=coords.scaleBy(ts);
    const ll=(dx,dy)=>map.unproject(nw.add([dx,dy]),coords.z);
    const c=[ll(0,0),ll(ts.x,0),ll(0,ts.y),ll(ts.x,ts.y)].map(p=>srsFwd(srs,p.lat,p.lng));
    const Es=c.map(q=>q[0]),Ns=c.map(q=>q[1]);
    const minE=Math.min(...Es)-2,maxE=Math.max(...Es)+2,minN=Math.min(...Ns)-2,maxN=Math.max(...Ns)+2;
    const W=Math.round(ts.x*1.1),H=Math.round(ts.y*1.1),sx=(maxE-minE)/W,sy=(maxN-minN)/H;
    const [E0,N0]=c[0],dE1=c[1][0]-E0,dN1=c[1][1]-N0,dE2=c[2][0]-E0,dN2=c[2][1]-N0,det=dE1*dN2-dE2*dN1;
    const M11=ts.x*dN2/det,M12=-ts.x*dE2/det,M21=-ts.y*dN1/det,M22=ts.y*dE1/det;
    const T=[M11*sx,M21*sx,-M12*sy,-M22*sy,M11*(minE-E0)+M12*(maxN-N0),M21*(minE-E0)+M22*(maxN-N0)];
    const q=Object.assign({SERVICE:'WMS',VERSION:'1.1.1',REQUEST:'GetMap',FORMAT:'image/png',TRANSPARENT:'true',STYLES:'',
      SRS:'EPSG:'+this.options.srs,WIDTH:W,HEIGHT:H,BBOX:[minE,minN,maxE,maxN].map(v=>v.toFixed(2)).join(',')},this._p);
    const img=new Image();
    img.onload=()=>{const x=cv.getContext('2d');x.setTransform(...T);x.drawImage(img,0,0);done(null,cv)};
    img.onerror=()=>done(null,cv);
    img.src=this._url+'?'+Object.entries(q).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    return cv;
  }
});

function setBase(id){

  const crs=b.crs==='3395'?L.CRS.EPSG3395:L.CRS.EPSG3857;
  if(baseLayer)map.removeLayer(baseLayer);
  if(map.options.crs!==crs){
    const c=map.getCenter(),z=map.getZoom();
    const keep=[];Object.values(overlay).flat().forEach(l=>{map.removeLayer(l)});
    Object.values(shapeLayers).forEach(l=>{map.removeLayer(l);keep.push(l)});map.removeLayer(editGroup);map.removeLayer(rulerGroup);
    map.options.crs=crs;map._resetView(c,z,true);

function gfiUrl(lat,lon,dist){

  const bbox=[gE-r,gN-r,gE+r,gN+r].map(v=>v.toFixed(2)).join(',');

}

function measure(ll){
  const zone=zoneOf(ll[0]);
  const P=ll.map(([la,lo])=>{const u=utm(la,lo,zone);return [u.E,u.N]});
  let A=0,cx=0,cy=0;
  for(let i=0;i<P.length;i++){const [x1,y1]=P[i],[x2,y2]=P[(i+1)%P.length],c=x1*y2-x2*y1;A+=c;cx+=(x1+x2)*c;cy+=(y1+y2)*c}
  A/=2;const C=Math.abs(A)>1e-9?[cx/(6*A),cy/(6*A)]:P[0];
  const k=kScale(C[0]);
  let idx=P.map((_,i)=>i);if(A>0)idx.reverse();
  let s=0,best=Infinity;idx.forEach((i,j)=>{const v=P[i][0]-P[i][1];if(v<best){best=v;s=j}});
  idx=idx.slice(s).concat(idx.slice(0,s));
  const pts=idx.map((i,n)=>{const j=idx[(n+1)%idx.length];const dE=P[j][0]-P[i][0],dN=P[j][1]-P[i][1];
    return {n:n+1,E:P[i][0],N:P[i][1],lat:ll[i][0],lon:ll[i][1],len:Math.hypot(dE,dN)/k,dir:(Math.atan2(dE,dN)*180/Math.PI+360)%360}});
  const perim=pts.reduce((s,p)=>s+p.len,0);
  let selfX=false;const seg=(a,b,c,d)=>{const o=(p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]));return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0};
  for(let i=0;i<P.length&&!selfX;i++)for(let j=i+2;j<P.length;j++){if(i===0&&j===P.length-1)continue;if(seg(P[i],P[(i+1)%P.length],P[j],P[(j+1)%P.length])){selfX=true;break}}
  return {zone,area:Math.abs(A)/(k*k),perim,pts,center:utmInv(C[0],C[1],zone),cUtm:C,selfX};
}

  const rows=m.pts.map(p=>`<tr><td>${p.n}</td><td>${p.N.toFixed(2)}</td><td>${p.E.toFixed(2)}</td><td>${p.lat.toFixed(7)}</td><td>${p.lon.toFixed(7)}</td><td>${p.n}–${p.n%m.pts.length+1}</td><td>${p.len.toFixed(2)}</td><td>${dms(p.dir)}</td></tr>`).join('');
  const scale=Math.round(1/(sc/(96/0.0254))/100)*100;
  const html=`<!doctype html><html lang="${LANG}"><head><meta charset="utf-8"><title>${esc(P.title)} — ${esc(s.name)}</title><style>
  body{font:13px/1.4 "Segoe UI",Arial,sans-serif;color:#111;background:#fff;margin:24px;max-width:780px}h1{font-size:18px;margin:0 0 4px}.sub{color:#555;margin:0 0 12px}
  table{border-collapse:collapse;width:100%;font-size:12px;margin-top:10px}th,td{border:1px solid #999;padding:3px 6px;text-align:right}th{background:#eee}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:10px 0}.meta b{font-weight:600}.np{margin:14px 0}@media print{.np{display:none}body{margin:10mm}}</style></head><body>
  <div class="np"><button onclick="print()">${P.printBtn}</button></div>
  <h1>${esc(P.title)}: ${esc(s.name)}</h1><p class="sub">${P.use}: ${esc(t('purposes')[purposeIdx(s)])} · ${P.sub}</p>
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="border:1px solid #999;max-width:${W}px">${svg}</svg>
  <div class="meta"><b>${P.area}</b><span>${fmt(m.area,1)} ${t('m')}² · ${fmt(m.area/10000,4)} ${t('ha')} · ${fmt(m.area/100,2)} ${LANG==='ru'?'сот.':'sotka'}</span>
  <b>${P.perim}</b><span>${fmt(m.perim,2)} ${t('m')}</span><b>${P.center}</b><span>${m.center[0].toFixed(6)}, ${m.center[1].toFixed(6)} (WGS 84)</span>
  <b>${P.crs}</b><span>${P.crsText(m.zone)}</span><b>${P.scale}</b><span>${P.scaleText(scale)}</span></div>
  <table><tr>${P.th.map(h=>`<th>${h}</th>`).join('')}</tr>${rows}</table>
  <p class="sub" style="margin-top:12px">${P.foot}</p></body></html>`;
  const wdw=window.open('','_blank');if(!wdw){alert(t('popupBlocked'));return}wdw.document.write(html);wdw.document.close();
};

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const xesc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const kmlColor=(c,a)=>a+c.slice(5,7)+c.slice(3,5)+c.slice(1,3);
document.getElementById('eKml').onclick=()=>{if(!shapes.length)return;
  download('plots.kml',`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${xesc(t('kmlDoc'))}</name>`+
  shapes.map(s=>{const m=measure(s.ll);return `<Placemark><name>${xesc(s.name)}</name><description>${xesc(t('purposes')[purposeIdx(s)])}; ${fmt(m.area,1)} ${t('m')}² (${fmt(m.area/10000,4)} ${t('ha')}); ${t('perim').toLowerCase()} ${fmt(m.perim,2)} ${t('m')}</description><Style><LineStyle><color>${kmlColor(s.c,'ff')}</color><width>2</width></LineStyle><PolyStyle><color>${kmlColor(s.c,'40')}</color></PolyStyle></Style><Polygon><outerBoundaryIs><LinearRing><coordinates>${s.ll.concat([s.ll[0]]).map(([a,b])=>`${b},${a},0`).join(' ')}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`}).join('')+`</Document></kml>`,'application/vnd.google-earth.kml+xml')};
document.getElementById('eGeo').onclick=()=>{if(!shapes.length)return;
  download('plots.geojson',JSON.stringify({type:'FeatureCollection',features:shapes.map(s=>{const m=measure(s.ll);return {type:'Feature',properties:{name:s.name,use:t('purposes')[purposeIdx(s)],area_m2:+m.area.toFixed(1),area_ha:+(m.area/10000).toFixed(4),perimeter_m:+m.perim.toFixed(2)},geometry:{type:'Polygon',coordinates:[s.ll.concat([s.ll[0]]).map(([a,b])=>[+b.toFixed(8),+a.toFixed(8)])]}}})},null,1),'application/geo+json')};
document.getElementById('eCsv').onclick=()=>{if(!shapes.length)return;
  const dec=v=>LANG==='ru'?String(v).replace('.',','):String(v);
  const rows=[t('csvHead')];
  shapes.forEach(s=>{const m=measure(s.ll);m.pts.forEach(p=>rows.push([s.name,t('purposes')[purposeIdx(s)],dec(m.area.toFixed(1)),dec((m.area/10000).toFixed(4)),dec(m.perim.toFixed(2)),p.n,dec(p.N.toFixed(2)),dec(p.E.toFixed(2)),m.zone+'N',dec(p.lat.toFixed(7)),dec(p.lon.toFixed(7)),dec(p.len.toFixed(2)),dms(p.dir)]))});
  const sep=LANG==='ru'?';':',';
  download('plots.csv','\ufeff'+rows.map(r=>r.map(v=>new RegExp('['+sep+'"\\n]').test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(sep)).join('\r\n'),'text/csv')};
document.getElementById('impFile').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let n=0;
  const add=(ll,name)=>{if(ll.length>1&&ll[0][0]===ll[ll.length-1][0]&&ll[0][1]===ll[ll.length-1][1])ll.pop();if(ll.length>=3){shapes.push({id:'i'+Date.now().toString(36)+n,name:name||(t('plot')+' '+(shapes.length+1)),purpose:0,ll,c:COLORS[shapes.length%COLORS.length]});n++}};
  try{const txt=String(r.result);
    if(/<kml/i.test(txt)){const d=new DOMParser().parseFromString(txt,'text/xml');d.querySelectorAll('Placemark').forEach(pm=>{const c=pm.querySelector('Polygon coordinates');if(!c)return;
      add(c.textContent.trim().split(/\s+/).map(x=>x.split(',').map(Number)).filter(x=>x.length>=2).map(([lo,la])=>[la,lo]),pm.querySelector('name')?.textContent)})}
    else{const g=JSON.parse(txt);(g.features||[g]).forEach(f=>{const gm=f.geometry||f;const polys=gm.type==='Polygon'?[gm.coordinates]:gm.type==='MultiPolygon'?gm.coordinates:[];
      polys.forEach(pp=>add(pp[0].map(([lo,la])=>[la,lo]),f.properties&&(f.properties.name||f.properties.id)))})}
  }catch(e){alert(t('readFail')+e.message)}
  saveShapes();renderShapes();if(n){const g=L.featureGroup(shapes.slice(-n).map(s=>L.polygon(s.ll)));map.fitBounds(g.getBounds(),{padding:[40,40]})}ev.target.value=''};r.readAsText(f)};

// ---------------------------------------------------------------- language
function applyLang(){
  document.documentElement.lang=LANG;document.title=t('doc');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
  tg.textContent=panel.classList.contains('collapsed')?t('expand'):t('collapse');
  buildBaseList();buildEgknList();renderChips();fillPurposes();renderShapes();updRectArea();
  if(DRAW.mode)hint.textContent=t({poly:'hintPoly',rect:'hintRect',ruler:'hintRuler'}[DRAW.mode]);
  if(selId)select(selId,true);
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{localStorage.setItem('spinstencil-lang',LANG)}catch(e){}applyLang();if(S.base==='ghyb'||S.base==='ymap')setBase(S.base)});

map.on('moveend',save);
applyLang();setBase(S.base);refreshAll();
try{if(localStorage.getItem('egkn-tab')==='d')showTab(true)}catch(e){}
</script>
</body>
</html>
